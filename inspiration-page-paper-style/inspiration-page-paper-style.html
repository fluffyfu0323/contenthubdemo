<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感探索 · Paper Style</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-logo">
      <span class="logo-icon">🌐</span>
      <span class="logo-text">灵感探索</span>
      <span class="logo-sub">Paper Style</span>
    </div>
    <nav class="header-nav">
      <div class="view-switcher">
        <button class="view-btn active" data-view="explore">🌐 探索</button>
        <button class="view-btn" data-view="overview">📊 全景</button>
        <button class="view-btn" data-view="deepdive">🔍 深潜</button>
        <div class="nav-glider"></div>
      </div>
      <button class="header-back" onclick="window.location.href='../content-hub-demo.html'" title="返回内容力专区">
        ← 返回 Content Hub
      </button>
    </nav>
  </header>

  <!-- ===== 三栏布局 ===== -->
  <div class="app-layout">

    <!-- 左侧：时间轴 -->
    <aside class="timeline-panel" id="timelinePanel"></aside>

    <!-- 中央：3D 地球 -->
    <div class="globe-container" id="globeContainer">
      <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载地球…</div>
      </div>
      <div class="globe-status">
        <span class="status-dot"></span>
        <span>拖拽旋转 · 滚轮缩放 · 点击光点查看详情</span>
      </div>
    </div>

    <!-- 右侧：信息面板 -->
    <aside class="info-panel" id="infoPanel"></aside>

    <!-- ===== Overview 全景模式（占位） ===== -->
    <div class="view-overview-container" id="overviewContainer">
      <div class="view-placeholder">
        <div class="view-placeholder-icon">📊</div>
        <h2 class="view-placeholder-title">全景模式</h2>
        <p class="view-placeholder-desc">统计仪表盘 · 文化关系网络 · 数据全貌</p>
        <span class="view-placeholder-badge">即将上线</span>
      </div>
    </div>

    <!-- ===== Deep Dive 深潜模式 ===== -->
    <div class="view-deepdive-container" id="deepdiveContainer">
      <!-- 左侧信息面板 -->
      <div class="dd-sidebar">
        <h1 class="dd-title">深度灵感探索</h1>
        <p class="dd-subtitle">沉浸式文化资源发现 · 为游戏研发提供灵感</p>

        <!-- Card 1: 近期高热度文化 -->
        <div class="dd-card">
          <div class="dd-card-header">
            <span class="dd-card-icon">🔥</span>
            <span class="dd-card-title">近期高热度文化</span>
            <span class="dd-card-badge">HOT</span>
          </div>
          <div class="dd-card-body-row">
            <div class="dd-hot-item">
              <div class="dd-hot-rank">1</div>
              <div class="dd-hot-info">
                <div class="dd-hot-name">三星堆文明</div>
              </div>
              <div class="dd-hot-trend dd-trend-up">↑ 182%</div>
            </div>
            <div class="dd-hot-item">
              <div class="dd-hot-rank">2</div>
              <div class="dd-hot-info">
                <div class="dd-hot-name">景德镇陶瓷</div>
              </div>
              <div class="dd-hot-trend dd-trend-up">↑ 96%</div>
            </div>
            <div class="dd-hot-item">
              <div class="dd-hot-rank">3</div>
              <div class="dd-hot-info">
                <div class="dd-hot-name">傩戏面具</div>
              </div>
              <div class="dd-hot-trend dd-trend-up">↑ 73%</div>
            </div>
          </div>
        </div>

        <!-- Card 2: 最新入库资产 -->
        <div class="dd-card dd-card-clickable" onclick="window.open('https://aquarwww.github.io/contenthubdemo_v1/content-hub-demo.html','_blank')">
          <div class="dd-card-header">
            <span class="dd-card-icon">📦</span>
            <span class="dd-card-title">最新入库资产</span>
            <span class="dd-card-badge dd-badge-new">NEW</span>
          </div>
          <div class="dd-card-body-row">
            <div class="dd-asset-item">
              <div class="dd-asset-dot" style="background: #FFD700;"></div>
              <div class="dd-asset-info">
                <div class="dd-asset-name">敦煌石窟</div>
              </div>
              <div class="dd-asset-count">36 件</div>
            </div>
            <div class="dd-asset-item">
              <div class="dd-asset-dot" style="background: #FF6B6B;"></div>
              <div class="dd-asset-info">
                <div class="dd-asset-name">浮世绘</div>
              </div>
              <div class="dd-asset-count">28 件</div>
            </div>
            <div class="dd-asset-item">
              <div class="dd-asset-dot" style="background: #C084FC;"></div>
              <div class="dd-asset-info">
                <div class="dd-asset-name">波斯地毯</div>
              </div>
              <div class="dd-asset-count">22 件</div>
            </div>
          </div>
        </div>

        <!-- Card 3: 最近联动评分 -->
        <div class="dd-card dd-card-clickable" onclick="window.open('https://fluffyfu0323.github.io/culturecollaborationmapping/culture-game-mapping_0506.html','_blank')">
          <div class="dd-card-header">
            <span class="dd-card-icon">📈</span>
            <span class="dd-card-title">最近联动评分</span>
          </div>
          <div class="dd-card-body dd-chart-body">
            <canvas id="ddChart" width="320" height="90"></canvas>
            <div class="dd-chart-legend">
              <span class="dd-legend-item"><span class="dd-legend-dot" style="background:#d6432f;"></span>游戏适配度</span>
              <span class="dd-legend-item"><span class="dd-legend-dot" style="background:#6EB5FF;"></span>视觉冲击力</span>
              <span class="dd-legend-item"><span class="dd-legend-dot" style="background:#4ADE80;"></span>叙事潜力</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 右侧正交地球 -->
      <div class="dd-globe-area" id="ddGlobeContainer">
        <div class="dd-globe-hint">拖拽旋转 · 探索全球文化地标</div>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>

</body>
</html>
